[project]
name = "ai-dialog-manager"
version = "0.1.0"
description = "PyQt6 manager for Claude Code & Codex chat sessions: browse, search, edit, resume."
requires-python = ">=3.12"
dependencies = ["PyQt6>=6.6"]

[project.scripts]
adm = "adm.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adm"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
